[project]
name = "echominer-api"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  # extraction pipeline -- pinned to the validated environment
  "PyMuPDF==1.26.5",
  "pandas==2.2.3",
  "numpy==2.1.1",
  "openpyxl>=3.1",
  "pillow>=10.4",   # openpyxl needs it to embed the logos in exports
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7,<0.17", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["echominer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
# The validated extractor is vendored byte-for-byte and must never be reformatted.
extend-exclude = ["echominer/vendor"]

[tool.ruff.lint]
# Pinned explicitly: newer ruff releases widen the default rule set.
select = ["E4", "E7", "E9", "F"]
