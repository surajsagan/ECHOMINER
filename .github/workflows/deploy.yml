name: Deploy
# Runs after CI passes on main. Does nothing until the three DEPLOY_* secrets
# exist (Settings > Secrets and variables > Actions), so it is safe to push
# before the server is ready.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: production, cancel-in-progress: false }

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets
        id: gate
        env: { HOST: "${{ secrets.DEPLOY_HOST }}" }
        run: |
          if [ -z "$HOST" ]; then echo "DEPLOY_HOST not set -- skipping deploy"; echo "ready=false" >> "$GITHUB_OUTPUT";
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy over SSH
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: cd /opt/echominer && ./infra/scripts/deploy.sh
