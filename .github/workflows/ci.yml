name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: echominer, POSTGRES_PASSWORD: echominer, POSTGRES_DB: echominer }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U echominer" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check echominer
      - name: Pipeline integrity
        run: |
          # The validated extractor must never be modified in place.
          test "$(sha256sum echominer/vendor/echo_extractor.py | cut -d' ' -f1)" \
             = "d49edd7d47a588f636b3fbe68d07d265d814db7cea1ba54feb59d390bc0be322" \
             || (echo "::error::vendored pipeline changed -- revalidation required" && exit 1)
      - name: Tests (SQLite)
        run: pytest -q --cov=echominer --cov-report=term-missing
      - name: Tests (PostgreSQL)
        env: { TEST_DATABASE_URL: "postgresql+psycopg://echominer:echominer@localhost:5432/echominer" }
        run: pytest -q
      - name: Migrations apply and match the models
        env: { DATABASE_URL: "postgresql+psycopg://echominer:echominer@localhost:5432/migcheck" }
        run: |
          PGPASSWORD=echominer psql -h localhost -U echominer -d echominer -c "create database migcheck"
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t echominer-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t echominer-web:ci .
      - name: API image imports and migrations are packaged
        run: docker run --rm echominer-api:ci sh -c "python -c 'import echominer.main, echominer.worker, fitz, pandas' && test -f alembic.ini && alembic --help >/dev/null"
      - name: nginx config is valid
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=echominer.in \
            -keyout /tmp/certs/origin.key -out /tmp/certs/origin.pem
          docker network create ci
          docker run -d --name api --network ci nginx:1.27-alpine
          docker run -d --name web --network ci nginx:1.27-alpine
          docker run --rm --network ci -v "$PWD/infra/nginx:/etc/nginx/conf.d:ro" \
            -v /tmp/certs:/etc/nginx/certs:ro nginx:1.27-alpine nginx -t

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip install -e apps/api
      - run: pip-audit --skip-editable || true
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
