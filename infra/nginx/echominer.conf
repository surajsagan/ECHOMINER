# Traffic arrives only via Cloudflare (proxied DNS, SSL mode "Full (strict)").
# TLS here uses a Cloudflare Origin Certificate; browsers see Cloudflare's cert.

include /etc/nginx/conf.d/cloudflare-ips.inc;
real_ip_header CF-Connecting-IP;

# Origin lock: only Cloudflare may talk to this server. Direct hits on the VM's
# IP get the connection closed. Checked against the TCP peer, not a header.
geo $realip_remote_addr $from_cloudflare {
    default 0;
    127.0.0.1 1;
    172.16.0.0/12 1;   # docker bridge: health checks and smoke tests run from the host
    include /etc/nginx/conf.d/cloudflare-geo.inc;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://echominer.in$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.echominer.in;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 301 https://echominer.in$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name echominer.in;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($from_cloudflare = 0) { return 444; }

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 200m;   # 20 files per job
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Job progress stream: no buffering, long read timeout.
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/v1/jobs {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /healthz { proxy_pass http://api:8000; include /etc/nginx/conf.d/proxy-common.inc; }
    location = /readyz  { proxy_pass http://api:8000; include /etc/nginx/conf.d/proxy-common.inc; }

    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
